<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula | Digital Artist</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <img src="assets/img/logo.svg" alt="Logotipo de Nébula" width="220" height="90">

        <nav>
            <a href="#galeria">Galería</a>
            <a href="#video">Vídeo</a>
            <a href="#audio">Audio</a>
            <a href="#contacto">Contacto</a>
        </nav>

    </header>

    <main>

        <!-- HERO -->

        <section id="hero">

            <figure>

                <img src="assets/img/hero.webp" alt="Imagen principal de Nébula" width="1920" height="1080">

                <figcaption>
                    Imagen de Auvryon obtenida de Pixabay (Licencia Pixabay).
                </figcaption>

            </figure>

            <div class="hero-content">

                <h1>Nébula</h1>

                <p>
                    Artista digital especializada en paisajes de ciencia ficción,
                    nebulosas y universos futuristas.
                </p>

                <a href="#galeria" class="btn">
                    Descubrir obras
                </a>

            </div>

        </section>

        <!-- GALERÍA -->

        <section id="galeria">

            <h2>Galería de trabajos</h2>

            <div class="galeria">

                <figure>

                    <img src="assets/img/imagen1.webp" alt="Imagen 1" width="400" height="250" loading="lazy">

                    <figcaption>
                        Imagen de Auvryon obtenida de Pixabay (Licencia Pixabay).
                    </figcaption>

                </figure>

                <figure>

                    <img src="assets/img/imagen2.webp" alt="Imagen 2" width="400" height="250" loading="lazy">

                    <figcaption>
                        Imagen de Auvryon obtenida de Pixabay (Licencia Pixabay).
                    </figcaption>

                </figure>

                <figure>

                    <img src="assets/img/imagen3.webp" alt="Imagen 3" width="400" height="250" loading="lazy">

                    <figcaption>
                        Imagen de Auvryon obtenida de Pixabay (Licencia Pixabay).
                    </figcaption>

                </figure>

            </div>

        </section>

        <!-- VÍDEO -->

        <section id="video">

            <h2>Vídeo de presentación</h2>

            <figure>

                <video controls poster="assets/img/poster.webp">

                    <source src="assets/video/presentacion.mp4" type="video/mp4">

                </video>

                <figcaption>
                    Vídeo de olenchic obtenido de Pixabay (Licencia Pixabay).
                </figcaption>

            </figure>

        </section>

        <!-- AUDIO -->

        <section id="audio">

            <h2>Audio ambiental</h2>

            <figure>

                <audio controls>

                    <source src="assets/audio/audio.mp3" type="audio/mpeg">

                </audio>

                <figcaption>
                    Audio "Dancing Stars" de BusinessStar obtenido de Pixabay (Licencia Pixabay).
                </figcaption>

            </figure>

        </section>

        <!-- CTA -->

        <section id="contacto">

            <figure>

                <a href="https://gmail.com" target="_blank" rel="noopener noreferrer">
                    <img src="assets/img/cta.webp" alt="Botón de contacto" width="600" height="200" loading="lazy">

                </a>

            </figure>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Nébula · Digital Artist
        </p>

    </footer>

</body>

</html>
